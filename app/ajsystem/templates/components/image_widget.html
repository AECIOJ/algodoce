{% if form is defined and form._resolved_fields is defined
   and form._resolved_fields | selectattr('input', 'equalto', 'image') | list %}
<link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css" rel="stylesheet">

<dialog id="modalCrop" class="modal">
  <div class="modal-box max-w-3xl">
    <form method="dialog">
      <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2" aria-label="Fechar" onclick="fecharCrop()">
        <svg class="w-4 h-4" aria-hidden="true"><use href="#i-xmark"/></svg>
      </button>
    </form>
    <h3 class="font-bold text-lg mb-2">Editar Foto</h3>
    <div class="text-center">
      <div id="crop-dropzone" class="border-2 border-dashed rounded p-5" tabindex="0"
           style="border-color:var(--fallback-b3, oklch(var(--b3)));cursor:pointer;min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;">
        <div style="font-size:3rem;color:var(--fallback-b3, oklch(var(--b3)));">📷</div>
        <p class="mb-0">Clique para escolher uma imagem</p>
        <p class="text-sm mb-0" style="color:color-mix(in srgb, var(--fallback-bc, oklch(var(--bc))) 50%, transparent);">ou cole uma imagem da área de transferência (Ctrl+V)</p>
      </div>
      <img id="crop-image" style="max-width:100%;display:none;">
      <input type="file" id="crop-input" accept="image/*" style="display:none">
    </div>
    <div class="modal-action justify-between items-center">
      <div class="flex gap-2 items-center">
        <button type="button" class="btn btn-error btn-outline btn-sm inline-flex items-center gap-1" id="crop-excluir" style="display:none" onclick="excluirImagem(_iw.ns)">
          <i class="bi bi-trash"></i> Excluir
        </button>
        <span id="crop-status" class="text-sm" style="color:color-mix(in srgb, var(--fallback-bc, oklch(var(--bc))) 50%, transparent);"></span>
      </div>
      <div class="flex gap-2">
        <button type="button" class="btn btn-ghost" onclick="fecharCrop()">Cancelar</button>
        <button type="button" class="btn btn-primary inline-flex items-center gap-1" id="crop-confirm" disabled onclick="salvarCrop()">
          <svg class="w-4 h-4" aria-hidden="true"><use href="#i-check"/></svg> Salvar
        </button>
      </div>
    </div>
  </div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
<script>
var _iw = { ns: null, cropper: null };

function _iwWidget(ns) {
  return document.querySelector('.image-widget[data-ns="' + ns + '"]');
}

function abrirCrop(ns) {
  _iw.ns = ns;
  var w = _iwWidget(ns);
  var temp = document.getElementById('temp-imagem-' + ns);
  var tem = (w && w.dataset.temImagem === '1') || (temp && temp.value !== '');
  document.getElementById('crop-excluir').style.display = tem ? '' : 'none';
  limparCrop();
  document.addEventListener('paste', handlePaste);
  document.getElementById('modalCrop').showModal();
  setTimeout(function() {
    var dz = document.getElementById('crop-dropzone');
    if (dz) dz.focus();
  }, 300);
}

function carregarImagem(src) {
  var dropzone = document.getElementById('crop-dropzone');
  var img = document.getElementById('crop-image');
  dropzone.style.display = 'none';
  img.style.display = 'block';
  img.src = src;
  if (_iw.cropper) _iw.cropper.destroy();
  _iw.cropper = new Cropper(img, {
    aspectRatio: NaN,
    viewMode: 1,
    autoCropArea: 1,
    responsive: true,
  });
  document.getElementById('crop-confirm').disabled = false;
  document.getElementById('crop-status').textContent = 'Arraste para ajustar o corte';
}

function handlePaste(e) {
  var items = (e.clipboardData || e.originalEvent.clipboardData).items;
  for (var i = 0; i < items.length; i++) {
    if (items[i].type.indexOf('image') === 0) {
      e.preventDefault();
      var blob = items[i].getAsFile();
      var reader = new FileReader();
      reader.onload = function(ev) { carregarImagem(ev.target.result); };
      reader.readAsDataURL(blob);
      return;
    }
  }
}

function limparCrop() {
  if (_iw.cropper) { _iw.cropper.destroy(); _iw.cropper = null; }
  var img = document.getElementById('crop-image');
  var dz = document.getElementById('crop-dropzone');
  var input = document.getElementById('crop-input');
  if (img) { img.style.display = 'none'; img.src = ''; }
  if (dz) dz.style.display = '';
  if (input) input.value = '';
  var conf = document.getElementById('crop-confirm');
  if (conf) conf.disabled = true;
  var st = document.getElementById('crop-status');
  if (st) st.textContent = '';
}

function fecharCrop() {
  var d = document.getElementById('modalCrop');
  if (d.open) d.close();
}

function salvarCrop() {
  if (!_iw.cropper || !_iw.ns) return;
  var canvas = _iw.cropper.getCroppedCanvas({ maxWidth: 1200, maxHeight: 1200 });
  var btn = document.getElementById('crop-confirm');
  var status = document.getElementById('crop-status');
  btn.disabled = true;
  status.textContent = 'Enviando...';
  canvas.toBlob(function(blob) {
    var reader = new FileReader();
    reader.onload = function() {
      fetch('/ajsystem/image-temp-upload', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ imagem: reader.result })
      })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.success) {
          document.getElementById('temp-imagem-' + _iw.ns).value = data.filename;
          document.getElementById('remover-imagem-' + _iw.ns).value = '';
          _iwMostrarPreview(_iw.ns, '/uploads/' + data.filename + '?t=' + Date.now());
          fecharCrop();
          if (window.marcarFormAlterado) window.marcarFormAlterado();
        } else {
          status.textContent = 'Erro: ' + (data.error || 'desconhecido');
          btn.disabled = false;
        }
      })
      .catch(function() {
        status.textContent = 'Erro de conexão';
        btn.disabled = false;
      });
    };
    reader.readAsDataURL(blob);
  }, 'image/jpeg', 0.92);
}

function excluirImagem(ns) {
  showConfirm('Excluir esta imagem?', function() {
    var w = _iwWidget(ns);
    var temp = document.getElementById('temp-imagem-' + ns);
    var temSalva = w && w.dataset.temImagem === '1';
    if (temp && temp.value) {
      var fn = temp.value;
      fetch('/ajsystem/image-temp-remove', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ filename: fn })
      }).catch(function() {});
      temp.value = '';
    }
    if (temSalva) {
      document.getElementById('remover-imagem-' + ns).value = '1';
    }
    _iwMostrarPlaceholder(ns);
    var d = document.getElementById('modalCrop');
    if (d && d.open) d.close();
    if (window.marcarFormAlterado) window.marcarFormAlterado();
  });
}

function _iwMostrarPreview(ns, src) {
  var w = _iwWidget(ns);
  if (!w) return;
  w.dataset.temImagem = '1';
  var img = document.getElementById('foto-preview-' + ns);
  if (img) {
    img.src = src;
  } else {
    var ph = document.getElementById('foto-placeholder-' + ns);
    var im = document.createElement('img');
    im.id = 'foto-preview-' + ns;
    im.src = src;
    im.className = 'rounded border object-cover cursor-pointer';
    im.style.cssText = 'width:144px;height:144px;';
    im.title = 'Clique para ampliar';
    im.onclick = function() { previewImagem(this.src); };
    if (ph && ph.parentNode) ph.parentNode.replaceChild(im, ph);
  }
}

function _iwMostrarPlaceholder(ns) {
  var w = _iwWidget(ns);
  if (!w) return;
  w.dataset.temImagem = '0';
  var img = document.getElementById('foto-preview-' + ns);
  if (img && img.parentNode) {
    var ph = document.createElement('div');
    ph.id = 'foto-placeholder-' + ns;
    ph.className = 'bg-base-200 rounded border flex items-center justify-center';
    ph.style.cssText = 'width:144px;height:144px;color:var(--fallback-b3, oklch(var(--b3)));font-size:3rem;';
    ph.textContent = '📸';
    img.parentNode.replaceChild(ph, img);
  }
}

document.addEventListener('DOMContentLoaded', function() {
  var dz = document.getElementById('crop-dropzone');
  if (!dz) return;
  dz.addEventListener('click', function() {
    document.getElementById('crop-input').click();
  });
  dz.addEventListener('paste', function(e) { handlePaste(e); });
  document.getElementById('crop-input').addEventListener('change', function(e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(ev) { carregarImagem(ev.target.result); };
    reader.readAsDataURL(file);
  });
  document.getElementById('modalCrop').addEventListener('close', function() {
    document.removeEventListener('paste', handlePaste);
    limparCrop();
  });
});
</script>
{% endif %}
