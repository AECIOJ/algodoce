<script src="{{ url_for('static', filename='js/phone-mask.js') }}"></script>
<script>
function cpfValido(n) {
  var s = n.replace(/\D/g, '');
  if (s.length !== 11) return false;
  if (/^(\d)\1+$/.test(s)) return false;
  var soma = 0;
  for (var i = 1; i <= 9; i++) soma += parseInt(s.charAt(i - 1)) * (11 - i);
  var resto = (soma * 10) % 11;
  if (resto === 10) resto = 0;
  if (resto !== parseInt(s.charAt(9))) return false;
  soma = 0;
  for (var i = 1; i <= 10; i++) soma += parseInt(s.charAt(i - 1)) * (12 - i);
  resto = (soma * 10) % 11;
  if (resto === 10) resto = 0;
  return resto === parseInt(s.charAt(10));
}
function cnpjValido(n) {
  var s = n.replace(/\D/g, '');
  if (s.length !== 14) return false;
  if (/^(\d)\1+$/.test(s)) return false;
  var w1 = [5,4,3,2,9,8,7,6,5,4,3,2];
  var soma = 0;
  for (var i = 0; i < 12; i++) soma += parseInt(s.charAt(i)) * w1[i];
  var resto = soma % 11;
  var d1 = resto < 2 ? 0 : 11 - resto;
  if (d1 !== parseInt(s.charAt(12))) return false;
  var w2 = [6,5,4,3,2,9,8,7,6,5,4,3,2];
  soma = 0;
  for (var i = 0; i < 13; i++) soma += parseInt(s.charAt(i)) * w2[i];
  resto = soma % 11;
  var d2 = resto < 2 ? 0 : 11 - resto;
  return d2 === parseInt(s.charAt(13));
}
function docToggle() {
  var cpf = document.querySelector('input[name="cpf"]');
  var cnpj = document.querySelector('input[name="cnpj"]');
  var ie = document.querySelector('input[name="insc_estadual"]');
  var temCpf = cpf.value.replace(/\D/g, '').length > 0;
  var temCnpj = cnpj.value.replace(/\D/g, '').length > 0;
  cnpj.disabled = temCpf;
  cpf.disabled = temCnpj;
  ie.disabled = !temCnpj;
}
function validarDoc(input, tipo) {
  var v = input.value.replace(/\D/g, '');
  if (!v) { input.setCustomValidity(''); return; }
  var valido = tipo === 'cpf' ? cpfValido(v) : cnpjValido(v);
  if (!valido) {
    input.setCustomValidity(tipo === 'cpf' ? 'CPF inválido' : 'CNPJ inválido');
  } else {
    input.setCustomValidity('');
  }
  input.reportValidity();
}
document.querySelectorAll('input[name="cpf"], input[name="cnpj"]').forEach(function(el) {
  el.addEventListener('input', docToggle);
  el.addEventListener('blur', function() { validarDoc(this, this.name); });
});
docToggle();
</script>
