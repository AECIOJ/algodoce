{{ fm.render_fields(form, data=instance, ro=ro) }}

{% if instance and instance.conta %}
<div class="row mb-3">
  <div class="col-md-3">
    <label class="form-label small mb-0">Telefone</label>
    <input type="text" class="form-control" value="{{ instance.conta.telefone or '' }}" readonly>
  </div>
</div>
{% endif %}

{{ fm.render_sessions(form, data=instance, ro=ro) }}

<div class="row mt-2">
  <div class="col-12">
    <label class="form-label small mb-0">Observação</label>
    <textarea name="observacao" class="form-control" rows="2" {{ 'disabled' if ro }}>{{ instance.observacao or '' if instance else '' }}</textarea>
  </div>
</div>

<input type="hidden" name="status" value="{{ instance.status if instance else 0 }}" id="status-field" data-original="{{ instance.status if instance else 0 }}">
<input type="hidden" name="atualizar_precos" value="" id="atualizar-precos-field">
