<script>
(function(){
  var gerar = document.querySelector('[name="gerar"]');
  var prazo = document.querySelector('[name="prazo_recebimento"]');
  if (gerar && prazo) {
    function toggle() { if (gerar.value == '0') { prazo.disabled = true; prazo.value = ''; } else { prazo.disabled = false; } }
    gerar.addEventListener('change', toggle);
    toggle();
  }
})();
</script>
