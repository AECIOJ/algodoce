{% if instance %}
<script>
function addConversao() {
  const container = document.getElementById('conversoes-list');
  const row = document.createElement('div');
  row.className = 'row mb-2 conversao-row';
  row.innerHTML = `
    <div class="col-md-4">
      <select name="conversion_unidade" class="form-select">
        {% for un in UND_INSUMO %}
          <option value="{{ un }}">{{ un }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-2 d-flex align-items-center">
      <span class="text-muted">=</span>
    </div>
    <div class="col-md-3">
      <input type="number" name="conversion_fator" class="form-control" step="0.000001" placeholder="0.000">
    </div>
    <div class="col-md-2 d-flex align-items-center">
      <span class="text-muted">{{ instance.unidade_medida }}</span>
    </div>
    <div class="col-md-1">
      <button type="button" class="btn btn-danger btn-sm" onclick="confirmRemove(this, 'Remover conversão?')"><img src="{{ url_for('static', filename='icons/minus-circle.svg') }}" height="16" alt="Remover" style="filter:brightness(0)invert(1)"></button>
    </div>
  `;
  container.appendChild(row);
}
</script>
{% endif %}
